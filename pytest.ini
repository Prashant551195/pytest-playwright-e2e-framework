[pytest]
testpaths = tests
addopts = --alluredir=allure-results --clean-alluredir --tracing retain-on-failure --video retain-on-failure --screenshot only-on-failure
markers =
    smoke: quick checks
    regression: full suite
    api: API tests
    e2e: end to end flows
    visual: screenshot comparison, local only
    a11y: accessibility checks